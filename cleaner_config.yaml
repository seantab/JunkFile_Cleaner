# ========================================================================
# File Cleaner Bot - Configuration
# ========================================================================
# Portable file cleanup utility with smart categorization and backup
# Place this utility in any project directory to clean temporary files
# 
# Authored and Architect: Sean Tabrizi
# Email: seantab@gmail.com
# ========================================================================

# File categories and their cleanup rules
file_categories:
  log_files:
    name: "Log Files"
    description: "Application and execution log files"
    extensions: [".log", ".out", ".txt"]
    directories: ["logs", "FileCleaner_logs"]
    default_retention_days: 30
    recommendation: "Keep recent logs for troubleshooting, older ones safe to remove"
    always_preserve: false
    
  report_files:
    name: "Data & Report Files"
    description: "Generated data files and reports"
    extensions: [".xlsx", ".xls", ".csv"]
    directories: []
    default_retention_days: 90
    recommendation: "Keep recent reports, archive older ones"
    preserve_count: 20  # Always keep last 20 files
    always_preserve: false
    
  temp_files:
    name: "Temporary Files"
    description: "Process IDs, coverage files, and other temporary artifacts"
    extensions: [".pid", ".coverage", ".tmp"]
    default_retention_days: 1
    recommendation: "Always safe to delete - temporary system files"
    always_preserve: false
    
  python_artifacts:
    name: "Python Cache & Artifacts"
    description: "Python cache, benchmarks, and test artifacts"
    directories: ["__pycache__", ".pytest_cache", ".benchmarks"]
    extensions: [".pyc", ".pyo"]
    default_retention_days: 30
    recommendation: "Safe to clean - can be regenerated by Python applications"
    always_preserve: false
    
  test_coverage_files:
    name: "Test Coverage Reports"
    description: "HTML coverage reports and test artifacts"
    directories: ["htmlcov", "coverage"]
    extensions: [".html"]
    default_retention_days: 14
    recommendation: "Coverage reports can be regenerated - safe to clean after retention period"
    always_preserve: false

# Files and directories to NEVER delete
protected_items:
  files:
    - "*.yaml"
    - "*.yml" 
    - "*.json"
    - "*.ps1"
    - "*.bat"
    - "*.sql"
    - "README.md"
    - "*.md"
    - "requirements*.txt"
    - ".gitignore"
    - "FileStructure.txt"
    - "counters.txt"
  directories:
    - ".git"
    - "config"
    - "documents"
    - "_Backup"
  patterns:
    - "*config*"
    - "*setup*"
    - "*install*"

# Backup settings for deleted files
backup:
  enabled: true
  location: "_FileCleaner_Backup"
  compress: true
  filename_pattern: "Backup_{target_directory}_{timestamp}.zip"
  max_backup_age_days: 30
  
# UI settings
ui:
  auto_open_browser: true
  port: 8502  # Different from main dashboard
  show_url_fallback: true
  theme: "clean"
  max_recent_directories: 5  # Number of recent directories to remember
  
# Keyboard shortcuts (case-insensitive)
keyboard_shortcuts:
  browse_directory: "disabled"  # Disabled - conflicts with browser bookmarks
  scan_directory: "ctrl+s"
  continue_next: "ctrl+enter"
  go_back: "ctrl+left"
  close_cleaner: "escape"
  select_all: "ctrl+a"
  refresh: "ctrl+r"
  
# Safety settings
safety:
  require_confirmation: true
  dry_run_mode: false  # Set to true for testing
  max_files_per_operation: 1000
  size_warning_threshold_gb: 1.0
